name: crm_thinkdigital
description: "ThinkDigital CRM - Time Tracker"
publish_to: "none"
version: 1.0.1+4

environment:
  sdk: ^3.11.0

dependencies: 
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  http: ^1.3.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  intl: ^0.20.2
  network_info_plus: ^6.1.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/theme/logo2.png"

flutter_native_splash:
  color: "#242F6D"
  image: "lib/theme/logo2.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - lib/theme/logo.png
    - lib/theme/logo2.png
